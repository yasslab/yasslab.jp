# cooldown: 公開から 7 日経った版だけを提案する。自動マージから本番へのデプロイまで人が見ないので、
# 乗っ取られたパッケージの悪い版を、取り下げられる前に配らないようにする
# （cooldown は security updates には効かず、脆弱性の修正はすぐ PR が出る）
version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    time: "20:00"
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  versioning-strategy: lockfile-only
  ignore:
  - dependency-name: faraday-net_http_persistent
    versions:
    - 1.1.0
  - dependency-name: declarative-option
    versions:
    - 0.1.1
  - dependency-name: puma
    versions:
    - 5.2.0
- package-ecosystem: github-actions
  # .github/actions/ の composite action で使う Actions も対象にする
  directories:
  - "/"
  - "/.github/actions/*"
  schedule:
    interval: weekly
    time: "20:00"
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  # akhileshns/heroku-deploy の `v4` はリリースではなく、2021年6月で止まった古いブランチ（Node.js 12）。
  # Dependabot はこれを 3.15.15 より新しい版と読み違えて、v4 へ「上げる」PR を作ることがある。
  # 本当に 4 系のリリースが出たら、この行を消してから上げる
  ignore:
  - dependency-name: akhileshns/heroku-deploy
    versions: [">= 4"]
