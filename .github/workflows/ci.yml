name: Test & Deploy
on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - "*"
  # Allows you to run this workflow manually from the Actions tab
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 2

    - name: 💎 Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: "🧪 Install gems with 'actions' group"
      run: |
        bundle config set with 'actions'
        bundle config set path 'vendor/bundle'
        bundle install --jobs 4 --retry 3

    - name: 🔧 Test building
      run: |
        bundle exec rake assets:precompile
        bundle exec rake test SKIP_BUILD=true

#    - name: ⏱ Test tasks
#      if: ${{ github.actor }} != *'dependabot'*
#      run: |
#        bundle exec rake share_calendar_events:test
#      env:
#        GOOGLE_CALENDAR_IDS: ${{ secrets.GOOGLE_CALENDAR_IDS }}
#        GOOGLE_SECRETS:      ${{ secrets.GOOGLE_SECRETS  }}
#        GOOGLE_TOKENS:       ${{ secrets.GOOGLE_TOKENS   }}

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-24.04
    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: 🟪 Set up Heroku CLI
      uses: ./.github/actions/setup-heroku-cli

    - name: 🚀 Deploy to Heroku
      uses: akhileshns/heroku-deploy@v3.15.15
      with:
        branch:          'main'
        usedocker:       false
        heroku_api_key:   ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: 'yasslab-jp'
        heroku_email:    'yohei@yasslab.jp'
        healthcheck:     'https://yasslab.jp/health'
        rollbackonhealthcheckfailed: true

    - name: ✅ Verify the release on Heroku
      run: ruby tasks/verify_heroku_release.rb "$(git rev-parse HEAD)"
      env:
        HEROKU_API_KEY:  ${{ secrets.HEROKU_API_KEY }}
        HEROKU_APP_NAME: 'yasslab-jp'

    - name: 🚨 Notify failure to Slack
      if: failure()
      uses: ./.github/actions/notify-failure
      with:
        channel-id:      ${{ secrets.SLACK_CHANNEL_NAME }}
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
