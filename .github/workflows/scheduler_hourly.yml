name: Scheduler for Houly Tasks

# Spec: https://docs.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule
# For debug: https://crontab.guru/
on:
  schedule:
    - cron:  '30 * * * *'    # Run every 60 minutes (hourly). Avoid 00:00 for stable date handling.
    #- cron:  '*/30 * * * *' # Run every 30 minutes
  # Allows you to run this workflow manually from the Actions tab
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

# 取ったニュースをコミットして main へ push するので contents だけ書き込みを渡し、ほかの権限は渡さない
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 2

    - name: 💎 Set up Ruby
      uses: ruby/setup-ruby@v1.335.0
      with:
        bundler-cache: true
        #ruby-version: 2.7 # Not necessary if .ruby-version is given

    - name: 🧪 Install Ruby gems with 'actions' group
      run: |
        bundle config set with 'actions'
        bundle config set path 'vendor/bundle'
        bundle install

    # 前回投稿した Ruby Weekly の号を覚えておく（cache は同じ key を上書きできないので、run ごとに key を変える）
    - name: 📦 Restore the last posted Ruby Weekly issue
      uses: actions/cache/restore@v6.1.0
      with:
        path: tmp/ruby_weekly_last_issue
        key:  ruby-weekly-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ruby-weekly-

    - name: 🔔 Notify fetched articles from RSS
      run:  bundle exec rake share_rss_articles
      env:
        SLACK_SHARE: ${{ secrets.SLACK_SHARE }}
        # 記事ごとの 3 行まとめに使う。要約できない記事は RSS の文で投稿し、最後にこのステップを赤にする
        OPENAI_ACCESS_TOKEN: ${{ secrets.OPENAI_ACCESS_TOKEN }}

    - name: 📦 Save the last posted Ruby Weekly issue
      if: ${{ always() && hashFiles('tmp/ruby_weekly_last_issue') != '' }}
      uses: actions/cache/save@v6.1.0
      with:
        path: tmp/ruby_weekly_last_issue
        key:  ruby-weekly-${{ github.run_id }}-${{ github.run_attempt }}

    # ここから先の手順は、前の手順（外部の RSS など）が落ちても動かす。
    # 着信通知は「過去 1 時間の録音」を読むので、飛ばすと次の回で取り戻せない。
    # 落ちた手順があれば、最後の Slack 通知（failure()）で知らせる（spec/scheduler_hourly_spec.rb）
    - name: 📞 Notify Twilio events to Slack
      if: ${{ !cancelled() }}
      run: bundle exec rake notify_twilio_events
      env:
        TWILIO_TEL_NUMBERS:    ${{ secrets.TWILIO_TEL_NUMBERS    }}
        TWILIO_ACCOUNT_SID:    ${{ secrets.TWILIO_ACCOUNT_SID    }}
        TWILIO_AUTH_TOKEN:     ${{ secrets.TWILIO_AUTH_TOKEN     }}
        TWILIO_SLACK_WEBHOOKS: ${{ secrets.TWILIO_SLACK_WEBHOOKS }}
        OPENAI_ACCESS_TOKEN:   ${{ secrets.OPENAI_ACCESS_TOKEN   }}

    - name: 📜 Upsert recent news from RSS
      id: upsert
      if: ${{ !cancelled() }}
      run: |
        bundle exec rake upsert_recent_notes
        bundle exec rake upsert_recent_press
        echo "HAS_NEWS=false" >> $GITHUB_ENV
        if [ -n "$(git status --porcelain)" ]; then
          if ( ruby -ryaml -e "p YAML.unsafe_load(STDIN.read)" < _data/news.yml > /dev/null ); then
            git config --global user.name  "Yohei Yasukawa"
            git config --global user.email "yohei@yasslab.jp"
            git checkout main
            git add _data/news.yml _data/press.yml img/news
            git commit -m '🤖 Upsert news by GitHub Actions'
            git push origin main
            echo "HAS_NEWS=true" >> $GITHUB_ENV
            echo "Found news."
          else
            echo "Detected YAML syntax error in '_data/news.yml' so not going to deploy."
          fi
        fi
      env:
        GITHUB_TOKEN:
        # note.com に英語版が無い記事の title_en を下訳するために使う。
        # 未設定でも upsert は動き、その場合 title_en を書かずに日本語表示へ戻す。
        OPENAI_ACCESS_TOKEN: ${{ secrets.OPENAI_ACCESS_TOKEN }}

    - name: ✅ No recent articles found
      if: ${{ !cancelled() && steps.upsert.outcome == 'success' && env.HAS_NEWS == 'false' }}
      run: |
        echo "No recent news found."

    - name: 🟪 Set up Heroku CLI
      if: ${{ !cancelled() && steps.upsert.outcome == 'success' && env.HAS_NEWS == 'true' }}
      uses: $/.github/actions/setup-heroku-cli

    - name: 🚀 Deploy to Heroku if recent news found
      id: deploy
      if: ${{ !cancelled() && steps.upsert.outcome == 'success' && env.HAS_NEWS == 'true' }}
      # Heroku の API キーを第三者の action に渡さないよう、自前の action で git push する。
      # 強制 push はしないので、後から動いた古い回は Heroku に拒否され、本番を古いコミットに戻さない
      # （spec/heroku_deploy_spec.rb で、全経路が同じ版を SHA で固定して使うことを守っている）
      uses: yasslab/heroku_deploy_action@v1.0.0
      with:
        branch:          'main'
        heroku_api_key:  ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: 'yasslab-jp'
        heroku_email:    'yohei@yasslab.jp'
        healthcheck:     'https://yasslab.jp/health'
        rollbackonhealthcheckfailed: true

    - name: ✅ Verify the release on Heroku
      if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
      run: ruby tasks/verify_heroku_release.rb "$(git rev-parse HEAD)"
      env:
        HEROKU_API_KEY:  ${{ secrets.HEROKU_API_KEY }}
        HEROKU_APP_NAME: 'yasslab-jp'

    - name: 🚨 Notify failure to Slack
      if: failure()
      uses: $/.github/actions/notify-failure
      with:
        channel-id:      ${{ secrets.SLACK_CHANNEL_NAME }}
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
