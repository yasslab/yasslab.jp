name: Uptime Check

# 本番のサイトが応答しているかを、30 分ごとに外から確かめる (死活監視)。
# GitHub の schedule は混んでいると遅れたり飛ばされたりするので、間隔は目安。
# 混みやすい 00 分・30 分を避ける。
on:
  schedule:
    - cron: '17,47 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    # 標準ライブラリだけで書いているので、setup-ruby を通さずランナーの Ruby で動かす
    - name: 🩺 Check if yasslab.jp is up
      run: ruby tasks/check_uptime.rb

    - name: 🚨 Notify failure to Slack
      if: failure()
      uses: ./.github/actions/notify-failure
      with:
        channel-id:      ${{ secrets.SLACK_CHANNEL_NAME }}
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
